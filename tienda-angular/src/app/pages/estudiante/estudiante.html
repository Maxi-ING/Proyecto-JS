<div class="pagina-contenedor">
  <section class="contenedor">
    <h1>Registro de Estudiante</h1>

    <div class="formulario">
      <label>Nombre del estudiante</label>
      <input
        type="text"
        [(ngModel)]="nombre"
        placeholder="Ingrese nombre">

      <label>Nota 1</label>
      <input type="number" [(ngModel)]="nota1" min="0" max="20" step="0.1">

      <label>Nota 2</label>
      <input type="number" [(ngModel)]="nota2" min="0" max="20" step="0.1">

      <label>Nota 3</label>
      <input type="number" [(ngModel)]="nota3" min="0" max="20" step="0.1">

      <label>Nota 4</label>
      <input type="number" [(ngModel)]="nota4" min="0" max="20" step="0.1">

      <button (click)="calcularPromedio()">
        Calcular Promedio
      </button>

      <span class="error-texto" *ngIf="errorNota">
        Las notas deben estar entre 0 y 20.
      </span>
    </div>

    <div class="resultado" *ngIf="promedio > 0 || nombre !== ''">      <h2>Resultado</h2>
      <p><strong>Nombre:</strong> {{ nombre }}</p>
      <p><strong>Suma:</strong> {{ suma }}</p>
      <p><strong>Promedio:</strong> {{ promedio | number:'1.1-2' }}</p>
      <p><strong>Estado académico:</strong> <span class="badge" [ngClass]="estadoAcademico.toLowerCase().replace(' ', '-')">{{ estadoAcademico }}</span></p>
      <p><strong>Estado:</strong> <span class="badge" [ngClass]="estado.toLowerCase().replace(' ', '-')">{{ estado }}</span></p>
    </div>
  </section>
</div>
